<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial de Movimientos</title>
    <link rel="stylesheet" href="../static/productos.css">
</head>
<body>

<h2>Historial de Movimientos</h2>

<form method="GET" action="/movimientos">
    <label>Filtrar por tipo:</label>
    <select name="tipo">
        <option value="">Todos</option>
        <option value="Entrada" {% if tipo == "Entrada" %}selected{% endif %}>Entrada</option>
        <option value="Salida" {% if tipo == "Salida" %}selected{% endif %}>Salida</option>
    </select>
    <button type="submit">Filtrar</button>
</form>

<table class="tabla-productos">
    <thead>
        <tr>
            <th>ID</th>
            <th>Producto</th>
            <th>Tipo</th>
            <th>Cantidad</th>
            <th>Fecha y Hora</th>
            <th>Realizado por</th>
        </tr>
    </thead>

    <tbody>
        {% for m in movimientos %}
        <tr>
            <td>{{ m.IdMovimiento }}</td>
            <td>{{ m.Producto }}</td>
            <td>{{ m.TipoMovimiento }}</td>
            <td>{{ m.Cantidad }}</td>
            <td>{{ m.FechaHora }}</td>
            <td>{{ m.IdUsuario }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<p><a href="/admin_panel">Volver</a></p>

</body>
</html>
